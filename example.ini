[LeanTeX]
;The directory where Jixia is installed
Jixia = ../jixia/.lake/build/bin/jixia.exe

;The directory where the LaTeX compiler is installed, or a command to run it
LaTeX = pdflatex

; The directory where LeanTeX should store files it uses
WorkingDir = .leantex

; The path to the Lean code to be processed
CodePath = ./LeanTeX/Examples/Propositional.lean